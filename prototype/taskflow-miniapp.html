label{font-size:12px;color:#d8e9ff;font-weight:700}.hero-total{font-size:29px;font-weight:800;letter-spacing:-1px;margin-top:5px}.hero-total small{font-size:14px;font-weight:600;color:#d5e6ff;letter-spacing:0}.goal-ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#a9f0d2 0 68%,#ffffff39 68%);position:relative}.goal-ring:before{content:'';position:absolute;inset:5px;background:#4289ef;border-radius:50%}.goal-ring span{position:relative;font-size:13px;font-weight:800}.progress{height:7px;border-radius:10px;background:#ffffff35;margin:17px 0 8px;overflow:hidden;position:relative;z-index:1}.progress i{display:block;background:#b3f4d8;width:68%;height:100%;border-radius:inherit}.hero-foot{display:flex;justify-content:space-between;color:#deedff;font-size:11px;font-weight:600;position:relative;z-index:1}.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.person-card,.stat,.panel,.task-card,.shortcut{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.person-card{padding:14px}.person-head{display:flex;align-items:center;gap:8px;color:#69788e;font-weight:700;font-size:11px}.person-head .avatar{width:25px;height:25px;font-size:12px}.person-points{font-size:21px;font-weight:800;letter-spacing:-.6px;margin:8px 0 2px}.person-points small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0}.mini-bar{height:5px;background:#edf1f7;border-radius:9px;overflow:hidden;margin-top:9px}.mini-bar i{height:100%;display:block;background:var(--blue);border-radius:9px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}.section-head h2{font-size:16px;margin:0;letter-spacing:-.4px}.text-btn{background:none;color:var(--blue);font-size:12px;font-weight:800;padding:4px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:12px 10px;border-radius:17px}.stat-icon{font-size:17px}.stat-num x-shadow:0 2px 8px #263b5b10}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);padding:9px 12px calc(10px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid #e7edf5;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav{color:#94a0b2;background:none;display:flex;align-items:center;flex-direction:column;gap:4px;font-size:9px;font-weight:800;padding:3px}.nav b{font-size:19px;line-height:21px}.nav.active{color:#347fe8}.nav.add b{background:#3888f5;color:white;border-radius:13px;width:38px;height:34px;display:grid;place-items:center;margin-top:-9px;box-shadow:0 6px 12px #3988f744}.page-title{font-size:24px;letter-spacing:-.9px;margin:8px 2px 5px}.sub{color:var(--muted);font-size:12px;margin:0 2px 15px}.summary-row{display:flex;gap:8px;overflow:auto;margin:12px 0}.summary-pill{background:white;border:1px solid var(--line);border-radius:13px;padding:10px 12px;white-space:nowrap;font-size:11px;color:#687991;font-weight:700}.summary-pill strong{color:var(--ink);font-size:14px;margin-right:4px}.primary{width:100%;border-radius:15px;padding:14px;color:white;background:var(--blue);font-weight:800;box-shadow:0 8px 17px #3988f72b}.secondary{background:#eef4fc;color:#3d80dc;border-radius:13px;padding:11px 13px;font-weight:800}.danger{background:#fff0f1;color:#d75c67;border-radius:13px;padding:11px 13px;font-weight:800}.modal-wrap{position:fixed;inset:0;background:#14223a66;z-index:30;display:none;align-items:flex-end;justify-content:center}.modal-wrap.open{display:flex}.modal{width:min(460px,100%);max-height:90vh;overflow:auto;background:#f8fafd;border-radius:25px 25px 0 0;padding:11px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}.handle{width:38px;height:4px;background:#d8e0eb;border-radius:8px;margin:0 auto 17px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{margin:0;font-size:19px;letter-spacing:-.5px}.close{width:31px;height:31px;border-radius:50%;background:#eaf0f7;color:#7b899d;font-size:19px}.field{margin:13px 0}.field label{display:block;color:#687890;font-size:11px;font-weight:800;margin:0 0 7px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid #e1e8f0;border-radius:13px;background:#fff;padding:13px;color:var(--ink);outline:0}.field textarea{min-height:78px;resize:vertical}.choice-row{display:flex;gap:7px}.choice{flex:1;border:1px solid #e1e8f0;background:#fff;color:#697991;padding:10px 5px;border-radius:12px;font-size:11px;font-weight:800}.choice.selected{background:#eaf3ff;border-color:#82b6fa;color:#347fe8}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.confirm-card{padding:18px;background:#fff;border-radius:19px;text-align:center;margin:15px 0}.confirm-card .big{font-size:36px}.confirm-card h3{margin:8px 0}.confirm-card p{color:var(--muted);font-size:12px;line-height:1.5}.approval{border:1px solid #e9edf4;border-radius:17px;background:#fff;padding:14px;margin:9px 0}.approval-actions{display:flex;gap:7px;margin-top:12px}.approval-actions button{flex:1}.empty{text-align:center;padding:30px 18px;color:#8794a7}.empty b{display:block;font-size:32px;margin-bottom:8px}.toast{position:fixed;z-index:50;left:50%;bottom:91px;transform:translate(-50%,20px);opacity:0;background:#17243a;color:white;padding:11px 16px;border-radius:13px;font-size:12px;font-weight:700;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.week-switch{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px}.week-switch button{background:#fff;border:1px solid var(--line);width:34px;height:34px;border-radius:11px;color:#4a85d5;font-size:18px}.week-switch strong{font-size:12px}.score-card{padding:16px;background:white;border:1px solid var(--line);border-radius:19px;margin-bottom:10px}.score-top{display:flex;align-items:center;justify-content:space-between}.score-name{font-weight:800}.score-total{font-size:22px;font-weight:800;letter-spacing:-.8px}.score-detail{display:flex;justify-content:space-between;margin-top:11px;color:#8793a5;font-size:10px}.score-detail b{color:#45536a}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.setting-row:last-child{border:0}.setting-row span{font-weight:700}.setting-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.setting-row button{background:#eef4fc;color:#4385dd;padding:8px 10px;border-radius:10px;font-weight:800;font-size:11px}@keyframes up{from{transform:translateY(30px);opacity:.7}to{transform:translateY(0);opacity:1}}@media(min-width:700px){body{padding:25px 0}.app{min-height:calc(100vh - 50px);border-radius:32px;box-shadow:0 24px 80px #1e35551c}.bottom{bottom:25px;border-radius:0 0 32px 32px}.modal-wrap{align-items:center}.modal{border-radius:25px;padding-bottom:22px}}
/* Dark palette follows Telegram's night surfaces while keeping the same accent hierarchy. */
:root[data-theme="dark"]{color-scheme:dark;--bg:#111820;--card:#1a242f;--ink:#eef3fa;--muted:#91a0b2;--line:#293643;--blue:#4a96ff;--blue2:#213852;--shadow:0 12px 36px #00000024}
:root[data-theme="dark"] body{background:var(--bg)}

:root[data-theme="dark"] .profile{color:#dce5f0}
:root[data-theme="dark"] .person-head,:root[data-theme="dark"] .score-detail,:root[data-theme="dark"] .task-meta{color:#9aaabd}
:root[data-theme="dark"] .mini-bar{background:#303d4a}
:root[data-theme="dark"] .check{border-color:#536274}
:root[data-theme="dark"] .badge{background:#293643;color:#a8b6c7}
:root[data-theme="dark"] .badge.blue{background:#203953;color:#80b8ff}
:root[data-theme="dark"] .badge.green{background:#1d3b34;color:#72d6b1}
:root[data-theme="dark"] .badge.orange{background:#423624;color:#f2c26e}
:root[data-theme="dark"] .badge.red{background:#432b32;color:#f08b95}

:root[data-theme="dark"] .tabscope button.active{background:#334250;color:#8fc0ff;box-shadow:none}
:root[data-theme="dark"] .bottom{background:#151e27f2;border-color:#293643}

:root[data-theme="dark"] .modal{background:#18222c}
:root[data-theme="dark"] .handle{background:#465360}
:root[data-theme="dark"] .close{background:#293743;color:#bac6d3}

:root[data-theme="dark"] .score-detail b{color:#dce5f0}

.top-actions{display:flex;align-items:center;gap:8px}.theme-toggle{width:36px;height:36px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#42516a;font-size:17px;display:grid;place-items:center}

<body><div class="app"><header class="top"><div class="brand"><div class="logo">✦</div>taskflow</div><div class="top-actions"><button class="theme-toggle" id="themeToggle" aria-label="Включить тёмную тему" onclick="toggleTheme()">☾</button><button class="profile" onclick="toast('Профиль: Макс')"><span class="avatar">🧑🏻</span> Макс⌄</button></div></header><main id="view" class="content"></main><nav class="bottom" id="nav"></nav></div><div class="modal-wrap" id="modalWrap" onclick="if(event.target===this)closeModal()"><section class="modal" id="modal"></section></div><div class="toast" id="toast"></div>
<script>
const peer='Вика';let page='home',scope='mine',filter='all',weekOffset=0;let nextId=12;
let tasks=[
{id:1,title:'Подготовить презентацию проекта',status:'IN_PROGRESS',target:'SELF',owner:'Макс',points:1200,deadline:'Сегодня',effort:90,comment:'Финальная версия для встречи',author:'Макс'},
{id:2,title:'Заказать продукты на неделю',status:'TODO',target:'SHARED',owner:'Оба',points:500,deadline:'Завтра',effort:30,comment:'Не забыть кофе и фрукты',author:'Вика'},
{id:3,title:'Разобрать кладовку',status:'BACKLOG',target:'PEER',owner:peer,points:800,deadline:'25 окт',effort:60,comment:'',author:'Макс'},
{id:4,title:'Сходить на тренировку',status:'TODO',target:'SELF',owner:'Макс',points:350,deadline:'Без срока',effort:60,comment:'',author:'Макс'},
{id:5,title:'Оплатить интернет',status:'DONE',target:'SELF',owner:'Макс',points:150,deadline:'Вчера',effort:5,comment:'',author:'Макс'},
{id:6,title:'Записать машину на ТО',status:'BACKLOG',target:'SELF',owner:'Макс',points:600,deadline:'Без срока',effort:20,comment:'',author:peer},
{id:7,title:'Выбрать фильм на вечер',status:'TODO',target:'SHARED',owner:'Оба',points:250,deadline:'Сегодня',effort:15,comment:'',author:'Макс'},
{id:8,title:'Купить корм для кота',status:'CANCELLED',target:'PEER',owner:peer,points:300,deadline:'Без срока',effort:10,comment:'',author:'Вика'}];
let penalties=[{name:'Опоздание',emoji:'⏰',method:'За минуту',rate:50,active:true},{name:'Instagram',emoji:'📱',method:'За минуту',rate:100,active:true},{name:'Другое',emoji:'✏️',method:'Вручную',rate:null,active:true}];
let templates=[{title:'Английский',points:500,effort:60},{title:'Диплом',points:500,effort:60},{title:'Тренировка',points:350,effort:60}];let results=[{name:'Макс',earned:6850,lost:400,goal:10000,emoji:'🧑🏻'},{name:'Вика',earned:5200,lost:150,goal:10000,emoji:'👩🏻'}];
const statuses={BACKLOG:['Ждёт согласования','orange'],TODO:['К выполнению','blue'],IN_PROGRESS:['В работе','blue'],DONE:['Выполнено','green'],CANCELLED:['Отменена','red']};
const money=n=>Number(n||0).toLocaleString('ru-RU');
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function go(p){page=p;render()}function navRender(){let items=[['home','⌂','Обзор'],['tasks','☷','Задачи'],['new','＋','Создать'],['inbox','♧','Входящие'],['stars','✦','Звёзды']];document.getElementById('nav').innerHTML=items.map(([id,icon,label])=>`<button class="nav ${page===id?'active':''} ${id==='new'?'add':''}" onclick="${id==='new'?'openTask()':`go('${id}')`}"><b>${icon}</b>${label}</button>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){let active=tasks.filter(t=>['TODO','IN_PROGRESS'].includes(t.status));let done=tasks.filter(t=>t.status==='DONE').length;let backlog=tasks.filter(t=>t.status==='BACKLOG').length;return `<div class="greeting"><div><div class="eyebrow">Пятница, 23 октября</div><h1>Привет, Макс 👋</h1></div><div class="week-chip">Неделя 19–25 окт.⌄</div></div><section class="hero"><div class="hero-head"><div><div class="hero-label">ТВОЙ РЕЗУЛЬТАТ ЗА НЕДЕЛЮ</div><div class="hero-total">${money(6450)} <small>/ 10 000 ✦</small></div></div><div class="goal-ring"><span>65%</span></div></div><div class="progress"><i style="width:65%"></i></div><div class="hero-foot"><span>✅ Задачи +6 850</span><span>⚠️ Штрафы −400</span></div></section><div class="duo">${results.map(r=>`<div class="person-card"><div class="person-head"><span class="avatar">${r.emoji}</span>${r.name=== 'Макс'?'ТВОЙ ПРОГРЕСС':'ВИКА'}</div><div class="person-points">${money(r.earned-r.lost)} <small>/ ${money(r.goal)}</small></div><div class="mini-bar"><i style="width:${(r.earned-r.lost)/r.goal*100}%;background:${r.name==='Макс'?'#3988f7':'#27b889'}"></i></div></div>`).join('')}</div><div class="section-head"><h2>Мой фокус</h2><button class="text-btn" onclick="go('tasks')">Все задачи →</button></div><div class="metrics"><div class="stat"><div class="stat-icon">📌</div><div class="stat-num">${active.filter(t=>t.status==='TODO').length}</div><div class="stat-label">К выполнению</div></div><div class="stat"><div class="stat-icon">▶️</div><div class="stat-num">${active.filter(t=>t.status==='IN_PROGRESS').length}</div><div class="stat-label">В работе</div></div><div class="stat"><div class="stat-icon">📥</div><div class="stat-num">${backlog}</div><div class="stat-label">На согласовании</div></div></div><div class="section-head"><h2>На сегодня</h2><button class="text-btn" onclick="go('tasks')">План · ${money(active.reduce((n,t)=>n+t.points,0))} ✦</button></div>${active.slice(0,3).map(taskRow).join('')}<div class="section-head"><h2>Быстрый доступ</h2></div><div class="shortcuts"><button class="shortcut" onclick="go('inbox')"><span class="tile">📥</span><span>Входящие<small>${backlog} ждут ответа</small></span></button><button class="shortcut" onclick="go('templates')"><span class="tile">📚</span><span>Шаблоны<small>Быстро создать</small></span></button></div>`}
function taskPage(){let all=tasks.filter(t=>{if(scope==='mine'&&t.owner!=='Макс'&&t.target!=='SHARED')return false;if(scope==='peer'&&t.owner==='Макс')return false;if(scope==='shared'&&t.target!=='SHARED')return false;if(scope==='assigned'&&t.author!=='Макс')return false;return filter==='all'||filter==='active'&&['TODO','IN_PROGRESS'].includes(t.status)||filter==='work'&&t.status==='IN_PROGRESS'||filter==='backlog'&&t.status==='BACKLOG'||filter==='done'&&t.status==='DONE'||filter==='archive'&&['DONE','CANCELLED'].includes(t.status)});let todo=tasks.filter(t=>t.status==='TODO').reduce((n,t)=>n+t.points,0),work=tasks.filter(t=>t.status==='IN_PROGRESS').reduce((n,t)=>n+t.points,0);return `<h1 class="page-title">Задачи</h1><p class="sub">Весь план и задачи для вас двоих</p><div class="summary-row"><div class="summary-pill"><strong>${money(todo)}</strong> к выполнению</div><div class="summary-pill"><strong>${money(work)}</strong> в работе</div><div class="summary-pill"><strong>${money(todo+work)}</strong> план ✦</div></div><div class="tabscope">${[['mine','Мои'],['peer','Вики'],['shared','Общие'],['assigned','Создал']].map(([s,l])=>`<button class="${scope===s?'active':''}" onclick="scope='${s}';render()">${l}</button>`).join('')}</div><div class="filters">${[['all','Все'],['active','Активные'],['work','В работе'],['backlog','Согласование'],['done','Готово'],['archive','Архив']].map(([f,l])=>`<button class="${filter===f?'active':''}" onclick="filter='${f}';render()">${l}</button>`).join('')}</div>${all.length?all.map(taskRow).join(''):`<div class="empty"><b>☀️</b>Здесь пока нет задач</div>`}<button class="primary" onclick="openTask()">＋ Новая задача</button>`}
function inbox(){let pending=tasks.filter(t=>t.status==='BACKLOG');return `<h1 class="page-title">Входящие</h1><p class="sub">Предложения, которые ждут твоего решения</p>${pending.length?pending.map(t=>`<div class="approval"><div style="display:flex;justify-content:space-between"><span class="badge orange">${t.owner==='Макс'?'Нужно оценить':'Нужно принять'}</span><span class="task-points">✦ ${money(t.points)}${t.target==='SHARED'?' каждому':''}</span></div><h3 style="font-size:15px;margin:12px 0 5px">${esc(t.title)}</h3><div class="task-meta">От ${t.author} · ${t.deadline} · ${t.effort} мин.</div>${t.comment?`<p style="font-size:11px;color:#738198">${esc(t.comment)}</p>`:''}<div class="approval-actions"><button class="primary" style="padding:10px" onclick="approve(${t.id})">✓ Принять ${money(t.points)} ✦</button><button class="secondary" onclick="rateOther(${t.id})">Изменить</button></div><button class="text-btn" style="margin:8px 0 0" onclick="rejectTask(${t.id})">Отклонить предложение</button></div>`).join(''):`<div class="empty"><b>✨</b>Все предложения рассмотрены</div>`}`}
function stars(){return `<h1 class="page-title">Звёзды</h1><p class="sub">Результаты и история баллов</p><div class="week-switch"><button onclick="weekOffset--;render()">‹</button><strong>${weekOffset===0?'19 — 25 октября':weekOffset===-1?'12 — 18 октября':'Неделя '+(20+weekOffset*7)+' октября'}</strong><button onclick="weekOffset=Math.min(0,weekOffset+1);render()">›</button></div>${results.map(r=>{let earned=weekOffset===0?r.earned:r.earned-1900,lost=weekOffset===0?r.lost:r.lost+100,net=earned-lost,pct=Math.max(0,Math.min(100,net/r.goal*100));return `<section class="score-card"><div class="score-top"><div><div class="person-head"><span class="avatar">${r.emoji}</span><span class="score-name">${r.name}</span></div><div class="score-total" style="margin-top:9px">${money(net)} <span style="font-size:12px;color:#8793a5">/ ${money(r.goal)} ✦</span></div></div><div class="goal-ring" style="background:conic-gradient(${r.name==='Макс'?'#3988f7':'#27b889'} ${pct}%,#edf2f8 ${pct}%)"><span style="color:#25344b">${Math.round(pct)}%</span></div></div><div class="mini-bar"><i style="width:${pct}%;background:${r.name==='Макс'?'#3988f7':'#27b889'}"></i></div><div class="score-detail"><span>Задачи <b>+${money(earned)}</b></span><span>Штрафы <b>−${money(lost)}</b></span><span>Осталось <b>${money(Math.max(0,r.goal-net))}</b></span></div></section>`}).join('')}<div class="section-head"><h2>История баллов</h2><button class="text-btn" onclick="toast('Показаны последние 5 недель')">Все недели⌄</button></div><div class="panel">${['13–19 окт.','6–12 окт.','29 сен. – 5 окт.'].map((x,i)=>`<div class="setting-row"><span>📅 ${x}<small>Макс ${money([4550,8100,7200][i])} ✦ · Вика ${money([6020,3400,9110][i])} ✦</small></span><span class="badge ${i===1?'green':'blue'}">${i===1?'Цель достигнута':'Неделя'}</span></div>`).join('')}</div><div class="section-head"><h2>Штрафы</h2><button class="text-btn" onclick="go('penalties')">Смотреть все →</button></div><button class="shortcut" style="width:100%" onclick="go('penalties')"><span class="tile">⚠️</span><span>Штрафы этой недели<small>Макс −400 ✦ · Вика −150 ✦</small></span></button>`}
function templatePage(){return `<h1 class="page-title">Шаблоны</h1><p class="sub">Общие заготовки с готовой оценкой</p>${templates.map((t,i)=>`<div class="task-card" onclick="openTask(0,${i})"><div class="tile" style="width:38px;height:38px;border-radius:13px;background:#eef5ff;display:grid;place-items:center">${['📘','🎓','🏃'][i%3]}</div><div class="task-body"><div class="task-title">${esc(t.title)}</div><div class="task-meta">⏱ ${t.effort} мин. · готовая оценка</div></div><div class="task-points">✦ ${money(t.points)}</div></div>`).join('')}<button class="primary" onclick="editTemplate()">＋ Создать шаблон</button><div class="section-head"><h2>Автоматическая оценка</h2></div><p class="sub">Задачи себе и общие задачи из шаблона сразу попадают в план. Если изменить название, время или баллы, задаче понадобится согласование.</p>`}
function penaltyPage(){return `<h1 class="page-title">Штрафы</h1><p class="sub">Назначайте вручную, результаты сохраняют историю</p><button class="primary" onclick="penaltyForm()">＋ Назначить штраф</button><div class="section-head"><h2>Типы штрафов</h2><button class="text-btn" onclick="newPenaltyType()">＋ Новый тип</button></div><div class="panel">${penalties.map((p,i)=>`<div class="setting-row"><span>${p.emoji} ${p.name}<small>${p.method}${p.rate?` · ${money(p.rate)} ✦/мин`:''}</small></span><button onclick="togglePenalty(${i})">${p.active?'Вкл.':'Выкл.'}</button></div>`).join('')}</div><div class="section-head"><h2>Недавние</h2></div><div class="panel"><div class="setting-row"><span>⏰ Опоздание<small>Макс · 22 окт. · 8 минут</small></span><b style="color:#db6571">−400 ✦</b></div><div class="setting-row"><span>📱 Instagram<small>Вика · 21 окт. · 2 минуты</small></span><b style="color:#db6571">−200 ✦</b></div></div>`}
function settings(){return `<h1 class="page-title">Настройки</h1><p class="sub">Личные цели и параметры приложения</p><div class="panel"><div class="setting-row"><span>🎯 Недельная цель<small>Твоя цель на неделю</small></span><button onclick="setGoal()">10 000 ✦</button></div><div class="setting-row"><span>🌍 Часовой пояс<small>Для дат и дедлайнов</small></span><button onclick="setZone()">Москва</button></div><div class="setting-row"><span>📅 Неделя результатов<small>Общие границы для вас обоих</small></span><b style="font-size:11px">Пн — Вс</b></div></div><div class="section-head"><h2>Управление</h2></div><div class="shortcuts"><button class="shortcut" onclick="go('templates')"><span class="tile">📚</span><span>Шаблоны<small>${templates.length} активных</small></span></button><button class="shortcut" onclick="go('penalties')"><span class="tile">⚠️</span><span>Типы штрафов<small>${penalties.length} правила</small></span></button></div><div class="section-head"><h2>Пара</h2></div><div class="panel"><div class="setting-row"><span>🧑🏻 Макс<small>Участник TaskFlow</small></span><span class="badge green">Ты</span></div><div class="setting-row"><span>👩🏻 Вика<small>Участник TaskFlow</small></span><span class="badge blue">В сети</span></div></div>`}
function render(){navRender();let v=document.getElementById('view');v.innerHTML=({home, tasks:taskPage,inbox,stars,templates:templatePage,penalties:penaltyPage,settings}[page]||home)()}
function modal(content,title){document.getElementById('modal').innerHTML=`<div class="handle"></div><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${content}`;document.getElementById('modalWrap').classList.add('open')};function closeModal(){document.getElementById('modalWrap').classList.remove('open')}
function openTask(id=0,templateIndex=-1){let t=tasks.find(x=>x.id===id),tpl=templateIndex>=0?templates[templateIndex]:null;let target=t?.target||'SELF';modal(`<form id="taskForm" onsubmit="saveTask(event,${id})"><div class="field"><label>Название задачи</label><input name="title" maxlength="200" required placeholder="Например, подготовить презентацию" value="${esc(t?.title||tpl?.title||'')}"></div><div class="field"><label>Для кого</label><div class="choice-row">${[['SELF','Себе'],['PEER','Вике'],['SHARED','Вместе']].map(([v,l])=>`<button type="button" class="choice ${target===v?'selected':''}" data-target="${v}" onclick="selectTarget(this)">${l}</button>`).join('')}</div><input type="hidden" name="target" value="${target}"></div><div class="field"><label>Предложить звёзды · 1–10 000</label><input name="points" type="number" min="1" max="10000" placeholder="На оценку Вике" value="${t?.points||tpl?.points||''}"></div><div class="field"><label>Дедлайн</label><input name="deadline" type="date"></div><div class="field"><label>План, минут</label><input name="effort" type="number" min="1" max="10080" placeholder="Необязательно" value="${t?.effort||tpl?.effort||''}"></div><div class="field"><label>Комментарий</label><textarea name="comment" maxlength="1500" placeholder="Дополнительные детали">${esc(t?.comment||'')}</textarea></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Отмена</button><button class="primary">${id?'Сохранить':'Создать задачу'}</button></div>${id&&['TODO','IN_PROGRESS','BACKLOG'].includes(t.status)?`<button type="button" class="danger" style="width:100%;margin-top:10px" onclick="deleteTask(${id})">Отменить задачу</button>`:''}</form>`,id?'Редактировать задачу':'Новая задача')}
function selectTarget(btn){btn.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');btn.parentNode.nextElementSibling.value=btn.dataset.target}
function saveTask(e,id){e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f);if(id){Object.assign(tasks.find(t=>t.id===id),{title:v.title,target:v.target,owner:v.target==='SHARED'?'Оба':v.target==='PEER'?peer:'Макс',points:+v.points||null,deadline:v.deadline||'Без срока',effort:+v.effort||null,comment:v.comment});toast('Изменения сохранены')}else{tasks.unshift({id:nextId++,title:v.title,status:'BACKLOG',target:v.target,owner:v.target==='SHARED'?'Оба':v.target==='PEER'?peer:'Макс',points:+v.points||null,deadline:v.deadline||'Без срока',effort:+v.effort||null,comment:v.comment,author:'Макс'});toast(v.target==='SELF'?'Задача отправлена на согласование':'Предложение отправлено')}closeModal();render()}
function deleteTask(id){let t=tasks.find(x=>x.id===id);modal(`<div class="confirm-card"><div class="big">🗃️</div><h3>Отменить задачу?</h3><p>Задача попадёт в архив. Отменённая задача не начисляет баллы и не удаляется из истории.</p></div><div class="modal-actions"><button class="secondary" onclick="openTask(${id})">Назад</button><button class="danger" onclick="tasks.find(x=>x.id===${id}).status='CANCELLED';closeModal();render();toast('Задача отправлена в архив')">Подтвердить</button></div>`,'Архивирование')}
function quickDone(id){let t=tasks.find(x=>x.id===id);if(t.status==='TODO'||t.status==='IN_PROGRESS'){confirmAction('Завершить задачу?',`Будет начислено ${money(t.points)} звёзд${t.target==='SHARED'?' каждому':''}.`,()=>{t.status='DONE';render();toast('Задача выполнена · звёзды начислены')})}else openTask(id)}
function confirmAction(title,desc,fn){modal(`<div class="confirm-card"><div class="big">✨</div><h3>${title}</h3><p>${desc}</p></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Назад</button><button class="primary" id="confirmBtn">Подтвердить</button></div>`,'Подтверждение');document.getElementById('confirmBtn').onclick=()=>{closeModal();fn()}}
function approve(id){let t=tasks.find(x=>x.id===id);confirmAction('Принять предложение?',`Задача «${t.title}» перейдёт в план со стоимостью ${money(t.points)} ✦.`,()=>{t.status='TODO';toast('Задача добавлена в план');render()})}
function rateOther(id){let t=tasks.find(x=>x.id===id);modal(`<div class="field"><label>Финальная оценка · 1–10 000</label><input id="newRate" type="number" min="1" max="10000" value="${t.points}"></div><p class="sub">После принятия задача появится в плане.</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="let n=+document.getElementById('newRate').value;if(n<1||n>10000)return toast('Проверь сумму');tasks.find(x=>x.id===${id}).points=n;tasks.find(x=>x.id===${id}).status='TODO';closeModal();render();toast('Оценка сохранена')">Принять с оценкой</button></div>`,'Оценить задачу')}
function rejectTask(id){let t=tasks.find(x=>x.id===id);confirmAction('Отклонить предложение?',`«${t.title}» будет отменена без начисления звёзд.`,()=>{t.status='CANCELLED';render();toast('Предложение отклонено')})}
function transition(id,to){let t=tasks.find(x=>x.id===id),label={TODO:'вернуть к выполнению',IN_PROGRESS:'начать заново',CANCELLED:'отменить'}[to];confirmAction(to==='CANCELLED'?'Отменить задачу?':to==='TODO'||to==='IN_PROGRESS'&&t.status==='DONE'?'Открыть задачу снова?':'Изменить статус?',to==='CANCELLED'?'Задача останется в архиве без начисления баллов.':t.status==='DONE'?`Из результата исходной недели будут убраны ${money(t.points)} ✦${t.target==='SHARED'?' у обоих':''}.`:`Задача будет: ${label}.`,()=>{t.status=to;render();toast('Статус обновлён')})}
function detail(id){let t=tasks.find(x=>x.id===id),s=statuses[t.status];modal(`<div class="badge ${s[1]}">${s[0]}</div><h2 style="font-size:20px;margin:12px 0">${esc(t.title)}</h2><div class="panel"><div class="setting-row"><span>Исполнители</span><b>${t.owner}</b></div><div class="setting-row"><span>Оценка</span><b>✦ ${money(t.points)}${t.target==='SHARED'?' каждому':''}</b></div><div class="setting-row"><span>Дедлайн</span><b>${t.deadline}</b></div><div class="setting-row"><span>План</span><b>${t.effort||'—'} мин.</b></div><div class="setting-row"><span>Автор предложения</span><b>${t.author}</b></div></div>${t.comment?`<p class="sub" style="margin-top:12px">${esc(t.comment)}</p>`:''}<div class="modal-actions"><button class="secondary" onclick="openTask(${id})">✎ Изменить</button>${t.status==='TODO'?`<button class="primary" onclick="closeModal();transition(${id},'IN_PROGRESS')">▶ Начать</button>`:t.status==='IN_PROGRESS'?`<button class="primary" onclick="closeModal();quickDone(${id})">✓ Выполнить</button>`:t.status==='BACKLOG'?`<button class="primary" onclick="closeModal();approve(${id})">Оценить</button>`:t.status==='DONE'?`<button class="secondary" onclick="closeModal();transition(${id},'TODO')">↩ Вернуть</button>`:''}</div>${['TODO','IN_PROGRESS'].includes(t.status)?`<button class="danger" style="width:100%;margin-top:10px" onclick="closeModal();transition(${id},'CANCELLED')">Отменить задачу</button>`:''}`, 'Задача');}
function taskRow(t){let [label,color]=statuses[t.status];return `<article class="task-card" onclick="detail(${t.id})"><div class="check" onclick="event.stopPropagation();quickDone(${t.id})"></div><div class="task-body"><div class="task-title">${t.target==='SHARED'?'🤝 ':''}${esc(t.title)}</div><div class="task-meta"><span class="badge ${color}">${label}</span><span>◷ ${t.deadline}</span>${t.owner!=='Макс'?`<span>· ${t.owner}</span>`:''}</div></div>${t.points?`<div class="task-points">✦ ${money(t.points)}</div>`:''}</article>`}
function penaltyForm(){modal(`<div class="field"><label>Кому назначить</label><select id="penTarget"><option>Макс</option><option>Вика</option></select></div><div class="field"><label>Тип штрафа</label><select id="penType">${penalties.filter(p=>p.active).map((p,i)=>`<option value="${i}">${p.emoji} ${p.name} ${p.rate?`· ${p.rate} ✦/мин`:''}</option>`).join('')}</select></div><div class="field"><label>Минуты или баллы</label><input id="penAmount" type="number" min="1" value="5"></div><div class="field"><label>Комментарий</label><textarea id="penComment" placeholder="Пояснение"></textarea></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="previewPenalty()">Далее</button></div>`,'Новый штраф')}
function previewPenalty(){let p=penalties[+document.getElementById('penType').value],v=+document.getElementById('penAmount').value;if(v<1)return toast('Укажи сумму больше нуля');let points=p.method==='За минуту'?v*p.rate:p.rate||v,target=document.getElementById('penTarget').value,comment=document.getElementById('penComment').value;modal(`<div class="confirm-card"><div class="big">⚠️</div><h3>${p.emoji} ${p.name}</h3><p>${target} · ${p.method==='За минуту'?`${v} мин. × ${p.rate}`:`${v} баллов`}${comment?'<br>'+esc(comment):''}<br><br>Из результата недели будет вычтено <b>${money(points)} ✦</b>.</p></div><div class="modal-actions"><button class="secondary" onclick="penaltyForm()">Назад</button><button class="primary" onclick="closeModal();toast('Штраф подтверждён: −${money(points)} ✦')">Назначить</button></div>`,'Проверь штраф')}
function togglePenalty(i){penalties[i].active=!penalties[i].active;render();toast(penalties[i].active?'Тип включён':'Тип выключен')}
function editTemplate(){modal(`<div class="field"><label>Название</label><input id="tplName" required></div><div class="field"><label>Баллы · 1–10 000</label><input id="tplPoints" type="number" min="1" max="10000" value="500"></div><div class="field"><label>Время в минутах</label><input id="tplEffort" type="number" min="1" max="10080" value="60"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="let n=document.getElementById('tplName').value.trim(),p=+document.getElementById('tplPoints').value;if(!n||!p)return toast('Заполни название и баллы');templates.push({title:n,points:p,effort:+document.getElementById('tplEffort').value||null});closeModal();render();toast('Шаблон создан')">Создать шаблон</button></div>`,'Новый шаблон')}
function newPenaltyType(){modal(`<div class="field"><label>Название</label><input id="ptName" placeholder="Например, Без тренировки"></div><div class="field"><label>Emoji</label><input id="ptEmoji" value="⚠️"></div><div class="field"><label>Способ расчёта</label><select id="ptMethod"><option>За минуту</option><option>Фиксированная сумма</option><option>Вручную</option></select></div><div class="field"><label>Ставка</label><input id="ptRate" type="number" value="50"></div><button class="primary" onclick="let n=document.getElementById('ptName').value.trim();if(!n)return toast('Добавь название');penalties.push({name:n,emoji:document.getElementById('ptEmoji').value||'⚠️',method:document.getElementById('ptMethod').value,rate:+document.getElementById('ptRate').value||null,active:true});closeModal();render();toast('Тип добавлен')">Сохранить тип</button>`,'Новый тип штрафа')}
function setGoal(){modal(`<div class="field"><label>Недельная цель · 1–1 000 000</label><input id="goal" type="number" value="10000"></div><div class="choice-row">${[5000,10000,15000,20000].map(n=>`<button class="choice" onclick="document.getElementById('goal').value=${n}">${money(n)}</button>`).join('')}</div><button class="primary" style="margin-top:18px" onclick="let v=+document.getElementById('goal').value;if(v<1)return toast('Цель должна быть больше нуля');results[0].goal=v;closeModal();render();toast('Цель обновлена')">Сохранить</button>`,'Недельная цель')}
function setZone(){modal(`<div class="field"><label>Часовой пояс отображения дат</label><select><option>Europe/Moscow · Москва</option><option>Europe/Helsinki · Хельсинки</option><option>UTC</option></select></div><p class="sub">Общая неделя результатов остаётся прежней.</p><button class="primary" onclick="closeModal();toast('Часовой пояс сохранён')">Сохранить</button>`,'Часовой пояс')}
function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('taskflow-theme',theme);let dark=theme==='dark';document.getElementById('themeToggle').textContent=dark?'☀':'☾';document.getElementById('themeToggle').setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');document.querySelector('meta[name="theme-color"]').content=dark?'#111820':'#f4f7fb'}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
applyTheme(localStorage.getItem('taskflow-theme')||'light');render();
</script></body></html>
