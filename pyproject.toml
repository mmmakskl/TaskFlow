[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow"
version = "1.0.0"
requires-python = ">=3.12"
description = "Private peer-rated Telegram productivity bot"
dependencies = [
  "aiogram>=3.22,<4", "fastapi>=0.119,<1", "sqlalchemy[asyncio]>=2.0,<2.2",
  "asyncpg>=0.30,<1", "alembic>=1.16,<2", "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8",
       "httpx>=0.28,<1", "ruff>=0.12,<1", "mypy>=1.17,<3", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires real PostgreSQL"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/fakes.py" = ["ASYNC109"]
"app/web/miniapp.py" = ["B008"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
