services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: taskflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 2s
      retries: 30
  app:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      DATABASE_URL: postgresql://taskflow:local-development-only@db:5432/taskflow
      PORT: "10000"
    ports:
      - "127.0.0.1:10000:10000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
