<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="/static/miniapp.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.8 6 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 8.9 9.2 8z"/></svg></div>taskflow</div>
      <div class="top-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" onclick="toggleTheme()"></button>
        <button class="profile" id="profile"><span class="avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span><span id="profileName">Участник</span></button>
      </div>
    </header>
    <main id="view" class="content"></main>
    <nav class="bottom" id="nav"></nav>
  </div>
  <div class="modal-wrap" id="modalWrap" onclick="if(event.target===this)closeModal()">
    <section class="modal" id="modal"></section>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <script src="/static/miniapp.js"></script>
</body>
</html>
